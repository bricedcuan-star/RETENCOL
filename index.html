<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RETENCOL | Liquidación Express</title>
    <style>
        :root {
            --brand-primary: #0b2a59;
            --brand-accent: #2a9d59;
            --bg: #f4f7f6;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: var(--brand-primary); margin-bottom: 20px; font-size: 24px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: var(--brand-primary); color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background: var(--brand-accent); }
        #resultado { margin-top: 20px; padding: 15px; background: #e8f5e9; border-left: 5px solid var(--brand-accent); display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>RETENCOL | Calculadora</h1>
    
    <div class="form-group">
        <label>Valor Base ($)</label>
        <input type="number" id="valorBase" placeholder="Ej: 1500000">
    </div>

    <div class="form-group">
        <label>Concepto</label>
        <select id="concepto">
            <option value="servicio">Servicios (4 UVT)</option>
            <option value="compra">Compras (27 UVT)</option>
            <option value="agricola">Agrícola (92 UVT)</option>
        </select>
    </div>

    <button onclick="calcular()">Calcular Retención</button>

    <div id="resultado"></div>
</div>

<script>
    const UVT = 52374;
    const topes = { servicio: 4 * UVT, compra: 27 * UVT, agricola: 92 * UVT };
    const tarifas = { servicio: 0.04, compra: 0.025, agricola: 0.015 };

    function calcular() {
        const valor = parseFloat(document.getElementById('valorBase').value);
        const tipo = document.getElementById('concepto').value;
        const resDiv = document.getElementById('resultado');

        if (isNaN(valor)) { alert("Por favor ingresa un valor válido"); return; }

        if (valor < topes[tipo]) {
            resDiv.innerHTML = "<strong>Resultado:</strong> No aplica retención (Base inferior al tope).";
        } else {
            const retencion = valor * tarifas[tipo];
            resDiv.innerHTML = `<strong>Resultado:</strong> Retención estimada: $${retencion.toLocaleString('es-CO')}`;
        }
        resDiv.style.display = 'block';
    }
</script>

</body>
</html>
